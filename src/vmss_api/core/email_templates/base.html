<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block subject %}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family:Arial, Helvetica, sans-serif; color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
        <tr>
          <td style="background-color:#0b5fff; padding:20px 32px;">
            {% if logo_url %}
              <img src="{{ logo_url }}" alt="{{ company_name | default('VMSS') }}" height="32" style="display:block;">
            {% else %}
              <span style="font-size:20px; font-weight:bold; color:#ffffff; letter-spacing:0.5px;">{{ company_name | default('VMSS') }}</span>
            {% endif %}
          </td>
        </tr>
        <tr>
          <td style="padding:32px;">
            {% block content %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px; background-color:#f4f5f7; font-size:12px; color:#6b7280;">
            This is an automated message from {{ company_name | default('the Visitor Management System') }}. Please do not reply directly to this email.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
