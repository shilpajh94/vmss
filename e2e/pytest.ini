[pytest]
addopts =
    --base-url http://localhost:5173
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output e2e-results
    -p no:cacheprovider
markers =
    known_issue(id): a journey that currently fails because of a triaged, non-blocker finding in the VMSS_API QA report (strict xfail)
