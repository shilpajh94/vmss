name: vmss-new-api
type: generic
docroot: ""
webserver_type: generic
xdebug_enabled: false
database:
  type: postgres
  version: "17"
use_dns_when_possible: true

# uv (installed via .ddev/web-build/Dockerfile.uv) manages the Python
# interpreter (3.13) and the project's venv — see pyproject.toml / uv.lock.
web_environment:
  - PYTHONUNBUFFERED=1
  - EMAIL_ASSET_BASE_URL=https://vmss-new-api.ddev.site:8443

# Runs `uvicorn` inside the web container. `uv run` resolves/creates the venv
# from pyproject.toml + uv.lock on first run.
web_extra_daemons:
  - name: "vmss-api"
    command: "uv run uvicorn vmss_api.main:app --host 0.0.0.0 --port 8000 --reload"
    directory: /var/www/html
  # Without this, tasks dispatched via `.delay()` (e.g.
  # `invitations/tasks.py::send_visit_confirmation`) queue in Redis forever
  # with nothing consuming them — the confirmation email never actually
  # sends. `-A vmss_api.core.celery_app:celery_app` must name the Celery
  # instance explicitly; it isn't named `app`, Celery's convention-based
  # default for bare `-A <module>`.
  # `-Q vmss_api,notifications,cron_jobs` must list every queue named in
  # `core/celery_app.py`'s `task_routes` (plus the default `vmss_api` queue)
  # — without it, a bare `worker` with no `-Q` only drains the default
  # queue, and every invitations/notifications task (routed to
  # "notifications") or reports task (routed to "cron_jobs") sits in Redis
  # forever with nothing consuming it, even though the worker itself shows
  # RUNNING. Deployed environments intentionally split these across
  # dedicated worker processes (see `core/celery_app.py`'s own comment); this
  # single local worker instead has to cover all of them at once.
  # Celery has no `--reload`, so `watchfiles` restarts worker and beat on any
  # change under `src/`. Without it they keep running the code from container
  # start: emails kept the pre-rebrand branding, and new tasks were dropped
  # as "unregistered" (autoreload-local-celery-worker). Default filter, not
  # `--filter python`: email templates (.html/.txt) and image assets count
  # too. `src/` rather than the repo root, because beat writes its
  # `celerybeat-schedule*` files there, which would loop restarts. SIGINT is
  # Celery's warm shutdown; in-flight tasks get 10 s before SIGKILL.
  - name: "vmss-api-celery-worker"
    command: "uv run watchfiles --sigint-timeout 10 'celery -A vmss_api.core.celery_app:celery_app worker --loglevel=info -Q vmss_api,notifications,cron_jobs' src"
    directory: /var/www/html
  # Beat only enqueues scheduled tasks (e.g. `reports/tasks.py`'s daily
  # rollup-snapshot dispatch, `core/celery_app.py`'s `beat_schedule`) — the
  # worker daemon above still does the actual execution. Without this
  # daemon, `beat_schedule` entries are configured but nothing ever
  # triggers them. Wrapped in `watchfiles` for the same reason as the worker.
  - name: "vmss-api-celery-beat"
    command: "uv run watchfiles --sigint-timeout 10 'celery -A vmss_api.core.celery_app:celery_app beat --loglevel=info' src"
    directory: /var/www/html

# Exposes the FastAPI app at https://vmss-new-api.ddev.site
web_extra_exposed_ports:
  - name: "vmss-api"
    container_port: 8000
    http_port: 8080
    https_port: 8443

hooks:
  post-start:
    - exec: "uv sync"
