# VMMS_WEB static SPA edge. VITE_API_BASE_URL is baked into the JS bundle at
# build time and points straight at VMMS_API's own ingress (a separate repo
# and deployment) — the browser calls it cross-origin, so no reverse proxy is
# needed here, only static file serving. CORS must be enabled on VMMS_API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — client-side routing (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
