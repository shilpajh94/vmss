trigger:
- none

variables:
- group: VMSS-WEB-OS-STAGE
- name: dockerrepo
  value: 'company-apps/stg-vmss-api'
- name: imageTag
  value: '$(Build.BuildId)'

pool:
  name: 'VMSS'

stages:
- stage: Build_and_Push
  displayName: 'Build and Push Stage'

  jobs:
  - job: DockerBuildAndPush
    displayName: 'Docker Build and Push'

    steps:
    - checkout: self

    - task: Docker@2
      displayName: 'Login to Harbor Registry'
      inputs:
        command: 'login'
        containerRegistry: 'Harbor_Reg'

    - task: replacetokens@5
      displayName: 'Replace Environment Variables'
      inputs:
        targetFiles: '.env'
        encoding: 'auto'
        tokenPattern: 'doubleunderscores'

    - task: Docker@2
      displayName: 'Build Docker Image'
      inputs:
        containerRegistry: 'Harbor_Reg'
        repository: '$(dockerrepo)'
        command: 'build'
        Dockerfile: 'Dockerfile.openstack'
        buildContext: '.'
        tags: |
          $(imageTag)

    - task: Docker@2
      displayName: 'Push Docker Image'
      inputs:
        containerRegistry: 'Harbor_Reg'
        repository: '$(dockerrepo)'
        command: 'push'
        tags: |
          $(imageTag)

    - script: |
        echo "Docker build and push completed."
        echo "Repository: $(dockerrepo)"
        echo "Image tag: $(imageTag)"
        echo "Full image: harbor.openstack.mypits.org/$(dockerrepo):$(imageTag)"
      displayName: 'Display Image Reference'
