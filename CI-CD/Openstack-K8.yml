############################################
# Application Secret
############################################
apiVersion: v1
kind: Secret
metadata:
  namespace: $(namespace)
  name: $(proj_branch)-secret
type: Opaque
stringData:
  APP_NAME: "$(APP_NAME)"
  ENVIRONMENT: "$(ENVIRONMENT)"
  DEBUG: "$(DEBUG)"

  DB_USER: "$(DB_USER)"
  DB_PASSWORD: "$(DB_PASSWORD)"
  DB_HOST: "$(DB_HOST)"
  DB_PORT: "$(DB_PORT)"
  DB_NAME: "$(DB_NAME)"

  REDIS_URL: "$(REDIS_URL)"
  CELERY_BROKER_URL: "$(CELERY_BROKER_URL)"
  CELERY_RESULT_BACKEND: "$(CELERY_RESULT_BACKEND)"

  # Environment-specific Celery queues
  CELERY_NOTIFICATION_QUEUE: "$(ENVIRONMENT)_notifications"
  CELERY_CRON_QUEUE: "$(ENVIRONMENT)_cron_jobs"

  JWT_SECRET_KEY: "$(JWT_SECRET_KEY)"
  JWT_ALGORITHM: "$(JWT_ALGORITHM)"
  ACCESS_TOKEN_EXPIRE_MINUTES: "$(ACCESS_TOKEN_EXPIRE_MINUTES)"
  REFRESH_TOKEN_EXPIRE_MINUTES: "$(REFRESH_TOKEN_EXPIRE_MINUTES)"

  CORS_ALLOWED_ORIGINS: '$(CORS_ALLOWED_ORIGINS)'

  DEFAULT_TENANT_SLUG: "$(DEFAULT_TENANT_SLUG)"
  GLOBAL_SCHEMA_NAME: "$(GLOBAL_SCHEMA_NAME)"
  TENANT_SCHEMA_PREFIX: "$(TENANT_SCHEMA_PREFIX)"

  STORAGE_ROOT: "$(STORAGE_ROOT)"
  STORAGE_BACKEND: "$(STORAGE_BACKEND)"
  STORAGE_S3_PRESIGNED_URL_TTL_SECONDS: "$(STORAGE_S3_PRESIGNED_URL_TTL_SECONDS)"
  STORAGE_LOCAL_PRESIGNED_URL_TTL_SECONDS: "$(STORAGE_LOCAL_PRESIGNED_URL_TTL_SECONDS)"
  STORAGE_LOCAL_URL_SECRET: "$(STORAGE_LOCAL_URL_SECRET)"
  STORAGE_PUBLIC_BASE_URL: "$(STORAGE_PUBLIC_BASE_URL)"

  SMTP_HOST: "$(SMTP_HOST)"
  SMTP_PORT: "$(SMTP_PORT)"
  SMTP_USERNAME: "$(SMTP_USERNAME)"
  SMTP_PASSWORD: "$(SMTP_PASSWORD)"
  SMTP_USE_TLS: "$(SMTP_USE_TLS)"
  SMTP_FROM_ADDRESS: "$(SMTP_FROM_ADDRESS)"

  SMS_GATEWAY_BASE_URL: "$(SMS_GATEWAY_BASE_URL)"
  SMS_GATEWAY_API_KEY: "$(SMS_GATEWAY_API_KEY)"
  SMS_FROM_NUMBER: "$(SMS_FROM_NUMBER)"

  INVITATION_MAX_UPLOAD_SIZE_BYTES: "$(INVITATION_MAX_UPLOAD_SIZE_BYTES)"
  INVITATION_MAX_GROUP_VISITORS: "$(INVITATION_MAX_GROUP_VISITORS)"

  SSO_ENCRYPTION_KEY: "$(SSO_ENCRYPTION_KEY)"
  SSO_REDIRECT_URI: "$(SSO_REDIRECT_URI)"
  SSO_FRONTEND_CALLBACK_URL: "$(SSO_FRONTEND_CALLBACK_URL)"
  SSO_EXCHANGE_CODE_TTL_SECONDS: "$(SSO_EXCHANGE_CODE_TTL_SECONDS)"
  SSO_STATE_TTL_SECONDS: "$(SSO_STATE_TTL_SECONDS)"
  STAFF_PORTAL_URL: "$(STAFF_PORTAL_URL)"

  QR_TOKEN_ENCRYPTION_KEY: "$(QR_TOKEN_ENCRYPTION_KEY)"

  FCM_CREDENTIALS_PATH: "$(FCM_CREDENTIALS_PATH)"
  DB_POOL_SIZE: "$(DB_POOL_SIZE)"
  DB_MAX_OVERFLOW: "$(DB_MAX_OVERFLOW)"
  DB_POOL_TIMEOUT: "$(DB_POOL_TIMEOUT)"
  DB_POOL_RECYCLE: "$(DB_POOL_RECYCLE)"
  
  FAST2SMS_API_KEY: "$(FAST2SMS_API_KEY)"
  FAST2SMS_SENDER_ID: "$(FAST2SMS_SENDER_ID)"
  FAST2SMS_BASE_URL: "$(FAST2SMS_BASE_URL)"
  FAST2SMS_TEMPLATE_OTP: "$(FAST2SMS_TEMPLATE_OTP)"
  FAST2SMS_TEMPLATE_REGISTRATION_PENDING: "$(FAST2SMS_TEMPLATE_REGISTRATION_PENDING)"
  FAST2SMS_TEMPLATE_REGISTRATION_CONFIRMED: "$(FAST2SMS_TEMPLATE_REGISTRATION_CONFIRMED)"
  FAST2SMS_TEMPLATE_REGISTRATION_CONFIRMED_CODE: "$(FAST2SMS_TEMPLATE_REGISTRATION_CONFIRMED_CODE)"
  FAST2SMS_TEMPLATE_REGISTRATION_DENIED: "$(FAST2SMS_TEMPLATE_REGISTRATION_DENIED)"
  FAST2SMS_TEMPLATE_VISIT_RESCHEDULED: "$(FAST2SMS_TEMPLATE_VISIT_RESCHEDULED)"
  FAST2SMS_TEMPLATE_VISIT_DETAILS_CHANGED: "$(FAST2SMS_TEMPLATE_VISIT_DETAILS_CHANGED)"
  FAST2SMS_TEMPLATE_APPROVAL_REVERTED: "$(FAST2SMS_TEMPLATE_APPROVAL_REVERTED)"
  FAST2SMS_WHATSAPP_PHONE_NUMBER_ID: "$(FAST2SMS_WHATSAPP_PHONE_NUMBER_ID)"
  FAST2SMS_WHATSAPP_API_VERSION: "$(FAST2SMS_WHATSAPP_API_VERSION)"
  FAST2SMS_WHATSAPP_LANGUAGE_CODE: "$(FAST2SMS_WHATSAPP_LANGUAGE_CODE)"
  FAST2SMS_WHATSAPP_TEMPLATE_OTP: "$(FAST2SMS_WHATSAPP_TEMPLATE_OTP)"
  FAST2SMS_WHATSAPP_TEMPLATE_REGISTRATION_PENDING: "$(FAST2SMS_WHATSAPP_TEMPLATE_REGISTRATION_PENDING)"
  FAST2SMS_WHATSAPP_TEMPLATE_REGISTRATION_CONFIRMED: "$(FAST2SMS_WHATSAPP_TEMPLATE_REGISTRATION_CONFIRMED)"
  FAST2SMS_WHATSAPP_TEMPLATE_REGISTRATION_DENIED: "$(FAST2SMS_WHATSAPP_TEMPLATE_REGISTRATION_DENIED)"
  FAST2SMS_WHATSAPP_TEMPLATE_VISIT_RESCHEDULED: "$(FAST2SMS_WHATSAPP_TEMPLATE_VISIT_RESCHEDULED)"
  FAST2SMS_WHATSAPP_TEMPLATE_VISIT_DETAILS_CHANGED: "$(FAST2SMS_WHATSAPP_TEMPLATE_VISIT_DETAILS_CHANGED)"
  FAST2SMS_WHATSAPP_TEMPLATE_APPROVAL_REVERTED: "$(FAST2SMS_WHATSAPP_TEMPLATE_APPROVAL_REVERTED)"


---
############################################
# PersistentVolumeClaim
############################################
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: $(namespace)
  name: $(pvc_name)
spec:
  accessModes:
    - ReadWriteMany

  storageClassName: $(storageClassName)

  resources:
    requests:
      storage: $(pvc_storage)


---
############################################
# Application Service
############################################
apiVersion: v1
kind: Service
metadata:
  namespace: $(namespace)
  name: $(proj_branch)

  labels:
    app: $(proj_branch)

spec:
  selector:
    app: $(proj_branch)

  ports:
    - name: $(proj_port)
      port: 80
      targetPort: 8000
      protocol: TCP


---
############################################
# Application Deployment
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: $(namespace)
  name: $(proj_branch)

  labels:
    app: $(proj_branch)

spec:
  replicas: 1

  selector:
    matchLabels:
      app: $(proj_branch)

  template:
    metadata:
      labels:
        app: $(proj_branch)

    spec:
      containers:
        - name: $(proj_branch)

          image: harbor.openstack.mypits.org/$(dockerrepo)
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: $(proj_branch)-secret

          volumeMounts:
            - name: storage-volume
              mountPath: $(mount_path)

      volumes:
        - name: storage-volume

          persistentVolumeClaim:
            claimName: $(pvc_name)


---
############################################
# Celery Worker Deployment for cron jobs
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: $(namespace)
  name: $(proj_branch)-celery-worker-cron

  labels:
    app: $(proj_branch)-celery-worker-cron

spec:
  replicas: 1

  selector:
    matchLabels:
      app: $(proj_branch)-celery-worker-cron

  template:
    metadata:
      labels:
        app: $(proj_branch)-celery-worker-cron

    spec:
      containers:
        - name: celery-worker-cron

          image: harbor.openstack.mypits.org/$(dockerrepo)
          imagePullPolicy: IfNotPresent

          command:
            - celery

          args:
            - "-A"
            - "vmss_api.core.celery_app"
            - "worker"
            - "-Q"
            - "$(ENVIRONMENT)_cron_jobs"
            - "--concurrency=2"
            - "-l"
            - "info"

          env:
            - name: CELERY_BROKER_URL
              value: "$(CELERY_BROKER_URL)"

            - name: CELERY_RESULT_BACKEND
              value: "$(CELERY_RESULT_BACKEND)"

            - name: CELERY_CRON_QUEUE
              value: "$(ENVIRONMENT)_cron_jobs"

          envFrom:
            - secretRef:
                name: $(proj_branch)-secret

          volumeMounts:
            - name: storage-volume
              mountPath: $(mount_path)

      volumes:
        - name: storage-volume

          persistentVolumeClaim:
            claimName: $(pvc_name)


---
############################################
# Celery Worker Deployment for notifications
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: $(namespace)
  name: $(proj_branch)-celery-worker-notifications

  labels:
    app: $(proj_branch)-celery-worker-notifications

spec:
  replicas: 1

  selector:
    matchLabels:
      app: $(proj_branch)-celery-worker-notifications

  template:
    metadata:
      labels:
        app: $(proj_branch)-celery-worker-notifications

    spec:
      containers:
        - name: celery-worker-notifications

          image: harbor.openstack.mypits.org/$(dockerrepo)
          imagePullPolicy: IfNotPresent

          command:
            - celery

          args:
            - "-A"
            - "vmss_api.core.celery_app"
            - "worker"
            - "-Q"
            - "$(ENVIRONMENT)_notifications"
            - "--concurrency=2"
            - "-l"
            - "info"

          env:
            - name: CELERY_BROKER_URL
              value: "$(CELERY_BROKER_URL)"

            - name: CELERY_RESULT_BACKEND
              value: "$(CELERY_RESULT_BACKEND)"

            - name: CELERY_NOTIFICATION_QUEUE
              value: "$(ENVIRONMENT)_notifications"

          envFrom:
            - secretRef:
                name: $(proj_branch)-secret

          volumeMounts:
            - name: storage-volume
              mountPath: $(mount_path)

      volumes:
        - name: storage-volume

          persistentVolumeClaim:
            claimName: $(pvc_name)


---
############################################
# Celery Beat Deployment
############################################
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: $(namespace)
  name: $(proj_branch)-celery-beat

  labels:
    app: $(proj_branch)-celery-beat

spec:
  replicas: 1

  selector:
    matchLabels:
      app: $(proj_branch)-celery-beat

  template:
    metadata:
      labels:
        app: $(proj_branch)-celery-beat

    spec:
      containers:
        - name: celery-beat

          image: harbor.openstack.mypits.org/$(dockerrepo)
          imagePullPolicy: IfNotPresent

          command:
            - celery

          args:
            - "-A"
            - "vmss_api.core.celery_app"
            - "beat"
            - "-l"
            - "INFO"

          env:
            - name: CELERY_BROKER_URL
              value: "$(CELERY_BROKER_URL)"

          envFrom:
            - secretRef:
                name: $(proj_branch)-secret


---
############################################
# Ingress
############################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: $(proj_branch)-ingress
  namespace: $(namespace)
  labels:
    app: $(proj_branch)
  annotations:
    konghq.com/plugins: acme-disable-key-auth
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/proxy-read-timeout: "300"
    konghq.com/proxy-send-timeout: "300"
    konghq.com/proxy-buffering: "on"
    konghq.com/client-max-body-size: "256m"
spec:
  ingressClassName: kong
  rules:
  - host: $(site_url)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: $(proj_branch)
            port:
              number: 80
  tls:
  - hosts:
    - $(site_url)
    secretName: $(proj_branch)-tls
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: $(proj_branch)-anon
  namespace: $(namespace)
  annotations:
    kubernetes.io/ingress.class: kong
username: $(proj_branch)-anon
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: acme-disable-key-auth
  namespace: $(namespace)
plugin: key-auth
config:
  anonymous: $(proj_branch)-anon