apiVersion: v1
kind: Service
metadata:
  namespace: $(namespace)
  name: $(proj_branch)
  labels:
    app: $(proj_branch)
spec:
  selector:
    app: $(proj_branch)
  ports:
    - name: http
      port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: $(namespace)
  name: $(proj_branch)
  labels:
    app: $(proj_branch)
spec:
  replicas: 1
  selector:
    matchLabels:
      app: $(proj_branch)
  template:
    metadata:
      labels:
        app: $(proj_branch)
    spec:
      # No Vault injector here: VITE_* values are baked into the JS bundle at
      # image build time (see CI-CD/build_push.yaml), so this pod has no
      # secrets to fetch at start-up — it's a pure static file server.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: $(proj_branch)
          image: docker-registry.dev.displayme.net/$(dockerrepo)
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10

---
############################################
# Ingress
############################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: $(proj_branch)-ingress
  namespace: $(namespace)
  labels:
    app: $(proj_branch)
  annotations:
    konghq.com/plugins: acme-disable-key-auth
    cert-manager.io/cluster-issuer: letsencrypt-prod
    konghq.com/proxy-read-timeout: "300"
    konghq.com/proxy-send-timeout: "300"
    konghq.com/proxy-buffering: "on"
    konghq.com/client-max-body-size: "256m"
spec:
  ingressClassName: kong
  rules:
  - host: $(site_url)
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: $(proj_branch)
            port:
              number: 80
  tls:
  - hosts:
    - $(site_url)
    secretName: $(proj_branch)-tls
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: $(proj_branch)-anon
  namespace: $(namespace)
  annotations:
    kubernetes.io/ingress.class: kong
username: $(proj_branch)-anon
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: acme-disable-key-auth
  namespace: $(namespace)
plugin: key-auth
config:
  anonymous: $(proj_branch)-anon