---
############################################
# Ingress
############################################
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: $(proj_branch)-ingress
  namespace: $(namespace)

  labels:
    app: $(proj_branch)

  annotations:

    # Kong
    konghq.com/plugins: acme-disable-key-auth

    # Cert Manager
    cert-manager.io/cluster-issuer: letsencrypt-prod

    # Timeout
    konghq.com/proxy-read-timeout: "300"
    konghq.com/proxy-send-timeout: "300"

    # Buffering
    konghq.com/proxy-buffering: "on"

    # Upload size
    konghq.com/client-max-body-size: "256m"

spec:

  ingressClassName: kong

  rules:

    - host: $(site_url)

      http:

        paths:

          - path: /
            pathType: Prefix

            backend:

              service:
                name: $(proj_branch)

                port:
                  number: 80

  tls:

    - hosts:
        - $(site_url)

      secretName: $(proj_branch)-tls


---
############################################
# Kong Consumer
############################################
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: $(proj_branch)-anon
  namespace: $(namespace)

  annotations:
    kubernetes.io/ingress.class: kong

username: $(proj_branch)-anon


---
############################################
# Kong Plugin
############################################
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: acme-disable-key-auth
  namespace: $(namespace)

plugin: key-auth

config:
  anonymous: $(proj_branch)-anon
