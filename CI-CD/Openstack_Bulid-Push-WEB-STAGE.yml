trigger:
- openstack-stage

variables:
- group: VMSS-WEB-OS-STAGE

pool:
  name: 'VMSS'

stages:
- stage: Build_and_Push
  displayName: 'Build and Push Stage'

  jobs:
  - job: DockerBuildAndPush
    displayName: 'Docker Build and Push'

    steps:
    - task: Docker@2
      displayName: 'Build VMMS_WEB image'
      inputs:
        containerRegistry: 'Harbor_Reg'
        repository: '$(dockerrepo)'
        command: 'build'
        Dockerfile: 'Dockerfile.openstack'
        buildContext: '$(Build.SourcesDirectory)'

        arguments: >
          --build-arg VITE_API_BASE_URL=$(VITE_API_BASE_URL)
          --build-arg VITE_ENTRA_CLIENT_ID=$(VITE_ENTRA_CLIENT_ID)
          --build-arg VITE_ENTRA_TENANT_ID=$(VITE_ENTRA_TENANT_ID)
          --build-arg VITE_ENTRA_REDIRECT_URI=$(VITE_ENTRA_REDIRECT_URI)
          --build-arg VITE_DEFAULT_TENANT_SLUG=$(VITE_DEFAULT_TENANT_SLUG)
          --build-arg VITE_FIREBASE_API_KEY=$(VITE_FIREBASE_API_KEY)
          --build-arg VITE_FIREBASE_AUTH_DOMAIN=$(VITE_FIREBASE_AUTH_DOMAIN)
          --build-arg VITE_FIREBASE_PROJECT_ID=$(VITE_FIREBASE_PROJECT_ID)
          --build-arg VITE_FIREBASE_STORAGE_BUCKET=$(VITE_FIREBASE_STORAGE_BUCKET)
          --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=$(VITE_FIREBASE_MESSAGING_SENDER_ID)
          --build-arg VITE_FIREBASE_APP_ID=$(VITE_FIREBASE_APP_ID)
          --build-arg VITE_FIREBASE_MEASUREMENT_ID=$(VITE_FIREBASE_MEASUREMENT_ID)
          --build-arg VITE_FIREBASE_VAPID_KEY=$(VITE_FIREBASE_VAPID_KEY)
          --build-arg VITE_SSO_TENANT_SLUG=$(VITE_SSO_TENANT_SLUG)

        tags: |
          $(Build.BuildId)

    - task: Docker@2
      displayName: 'Push VMMS_WEB image'
      inputs:
        containerRegistry: 'Harbor_Reg'
        repository: '$(dockerrepo)'
        command: 'push'
        tags: |
          $(Build.BuildId)