schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - Do not run the full pytest or e2e suite while implementing a change. Run only the changed feature's tests, plus tests of any area that depends on the changed code, plus tests/test_api_documentation.py for route or response-schema changes (.claude/rules/testing-standards.md §5).
      - If a task says "full suite", run the targeted set instead and note the substitution in the task. Run the full suite only when the user explicitly asks; CI runs it before merge.
      - In the completion summary, list the test modules run and any dependent area included, with the reason.
